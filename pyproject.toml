[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qentropyd"
version = "1.0.0"
description = "Self-verifying Quantum Entropy Daemon for Linux with NIST SP 800-22 & SP 800-90B validation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Pelle Nyberg", email = "pelle@coraxcolab.com" },
]
maintainers = [
    { name = "Corax CoLAB" },
]
keywords = [
    "quantum",
    "entropy",
    "qrng",
    "linux",
    "security",
    "nist-sp-800-22",
    "nist-sp-800-90b",
    "daemon",
    "cryptography",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
qentropyd = "qentropyd.cli:main"

[project.urls]
Homepage = "https://github.com/PelleNybe/qentropyd"
Documentation = "https://github.com/PelleNybe/qentropyd/tree/main/docs"
Repository = "https://github.com/PelleNybe/qentropyd"
Issues = "https://github.com/PelleNybe/qentropyd/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qentropyd = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["qentropyd"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
